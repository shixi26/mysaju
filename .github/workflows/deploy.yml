name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          REPOSITORY_NAME: 'mysaju'

      - name: Prepare for deployment
        run: |
          if [ ! -d "out" ]; then
            echo "Error: out directory not found"
            exit 1
          fi
          echo "Build output structure:"
          ls -la out
          
          # basePath로 인해 out/mysaju에 빌드된 경우, 루트로 복사
          if [ -d "out/mysaju" ]; then
            echo "Found mysaju directory, copying contents to root..."
            cp -r out/mysaju/* out/
            cp -r out/mysaju/.* out/ 2>/dev/null || true
            echo "Contents copied. Verifying index.html exists:"
            ls -la out/index.html || echo "WARNING: index.html still not found in root"
          else
            echo "No mysaju directory found, using root structure"
          fi
          
          echo "Final structure:"
          ls -la out | head -20
          echo "Checking for index.html:"
          if [ -f "out/index.html" ]; then
            echo "✓ index.html found in root"
            head -20 out/index.html
          else
            echo "✗ index.html NOT found in root"
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: false
